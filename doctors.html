<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أطباؤنا والاستشاريون | نبض للرعاية الطبية</title>
  <meta name="description" content="ابحث عن طبيبك المفضل في مركز نبض للرعاية الطبية. فلترة حسب التخصص، نوع الاستشارة، الجنس، والتوفر اليومي لحجز فوري ومؤكد.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="أطباؤنا والاستشاريون | نبض للرعاية الطبية">
  <meta property="og:description" content="تصفح نخبة الاستشاريين والأطباء المعتمدين واحجز كشفك الآن.">
  <meta property="og:image" content="./images/logo-icon.png">
  <meta property="og:site_name" content="نبض للرعاية الطبية">

  <link rel="icon" type="image/png" href="./images/logo-icon.png">
  <link rel="stylesheet" href="./css/style.css">

  <script src="./js/data.js"></script>
  <script src="./js/main.js" defer></script>
</head>
<body>

  <div id="site-header"></div>

  <main id="main-content">
    <section class="page-banner" aria-label="Page Banner">
      <img src="./images/banner.jpg" alt="الأطباء" class="page-banner-bg" fetchpriority="high" onerror="window.handleImageError(this)">
      <div class="container page-banner-content">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="./index.html" data-i18n="nav.home">الرئيسية</a>
          <span>/</span>
          <span data-i18n="nav.doctors">الأطباء</span>
        </nav>
        <h1 class="page-banner-title" data-i18n="doctorsPage.title">نخبة الأطباء والاستشاريين</h1>
        <p class="page-banner-desc" data-i18n="doctorsPage.subtitle">ابحث عن طبيبك المفضل وفلتر حسب التخصص ونوع الاستشارة وتوفر اليوم.</p>
      </div>
    </section>

    <section class="section section-light">
      <div class="container">
        <!-- شريط الفلاتر والبحث -->
        <div class="filter-card">
          <div class="filter-grid">
            <div class="form-group">
              <label for="doctor-search-input" class="form-label">🔍 <span data-i18n="doctorsPage.searchPlaceholder">ابحث باسم الطبيب</span></label>
              <input type="text" id="doctor-search-input" class="form-control" placeholder="ابحث باسم الطبيب أو اللقب..." data-i18n-placeholder="doctorsPage.searchPlaceholder">
            </div>

            <div class="form-group">
              <label for="doctor-specialty-filter" class="form-label" data-i18n="doctorsPage.filterSpecialty">التخصص الطبي</label>
              <select id="doctor-specialty-filter" class="form-select">
                <!-- يُحقن بـ JS -->
              </select>
            </div>

            <div class="form-group">
              <label for="doctor-type-filter" class="form-label" data-i18n="doctorsPage.filterType">نوع الاستشارة</label>
              <select id="doctor-type-filter" class="form-select">
                <option value="">الكل</option>
                <option value="clinic">كشف بالعيادة</option>
                <option value="video">استشارة فيديو</option>
                <option value="phone">استشارة هاتفية</option>
              </select>
            </div>

            <div class="form-group">
              <label for="doctor-gender-filter" class="form-label" data-i18n="doctorsPage.filterGender">الجنس</label>
              <select id="doctor-gender-filter" class="form-select">
                <option value="" data-i18n="doctorsPage.allGenders">الكل</option>
                <option value="male" data-i18n="doctorsPage.male">طبيب</option>
                <option value="female" data-i18n="doctorsPage.female">طبيبة</option>
              </select>
            </div>

            <div class="filter-checkbox-wrap">
              <input type="checkbox" id="doctor-available-filter">
              <label for="doctor-available-filter" style="font-weight:700;font-size:0.85rem;color:var(--coral);cursor:pointer;" data-i18n="doctorsPage.availableTodayOnly">متاح اليوم فقط</label>
            </div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-light);flex-wrap:wrap;gap:12px;">
            <div style="display:flex;align-items:center;gap:12px;">
              <label for="doctor-sort-filter" style="font-size:0.85rem;font-weight:700;color:var(--text-muted);" data-i18n="doctorsPage.sortBy">ترتيب حسب:</label>
              <select id="doctor-sort-filter" class="form-select" style="width:auto;padding-block:6px;">
                <option value="rating" data-i18n="doctorsPage.sortRating">الأعلى تقييماً</option>
                <option value="price-asc" data-i18n="doctorsPage.sortPriceAsc">الأقل سعراً</option>
                <option value="price-desc" data-i18n="doctorsPage.sortPriceDesc">الأعلى سعراً</option>
              </select>
            </div>

            <button type="button" class="btn btn-outline btn-sm" id="clear-filters-btn">
              🔄 <span data-i18n="doctorsPage.clearFilters">إعادة ضبط الفلاتر</span>
            </button>
          </div>
        </div>

        <!-- شريط عدد النتائج -->
        <div class="filter-results-bar">
          <div style="font-weight:700;color:var(--navy);">
            <span id="results-count-num">0</span> <span data-i18n="doctorsPage.resultsCount">طبيب متاح</span>
          </div>
        </div>

        <!-- شبكة بطاقات الأطباء -->
        <div class="doctors-grid" id="doctors-directory-grid">
          <!-- يُحقن بـ JS -->
        </div>

        <!-- حالة لا توجد نتائج -->
        <div class="empty-state" id="doctors-empty-state" style="display:none;">
          <div class="empty-state-icon">
            <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          </div>
          <h3 class="empty-state-title" data-i18n="doctorsPage.noResultsTitle">لم نجد أطباء يطابقون بحثك</h3>
          <p class="empty-state-desc" data-i18n="doctorsPage.noResultsDesc">جرب تغيير معايير البحث أو إعادة ضبط الفلاتر للاطلاع على قائمة الأطباء المتاحة.</p>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

</body>
</html>
