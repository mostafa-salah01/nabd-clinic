<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حجوزاتي ومواعيدي | نبض للرعاية الطبية</title>
  <meta name="description" content="إدارة ومتابعة مواعيدك الطبية المحفوظة في مركز نبض: تعديل موعد الكشف أو إلغاؤه والاطلاع على أرقام الحجوزات.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="حجوزاتي ومواعيدي | نبض للرعاية الطبية">
  <meta property="og:description" content="راجع مواعيدك الطبية وأرقام الحجز بسهولة.">
  <meta property="og:image" content="./images/logo-icon.png">
  <meta property="og:site_name" content="نبض للرعاية الطبية">

  <link rel="icon" type="image/png" href="./images/logo-icon.png">
  <link rel="stylesheet" href="./css/style.css">

  <script src="./js/data.js"></script>
  <script src="./js/main.js" defer></script>
</head>
<body>

  <div id="site-header"></div>

  <main id="main-content">
    <section class="page-banner" aria-label="Page Banner">
      <img src="./images/banner.jpg" alt="حجوزاتي" class="page-banner-bg" fetchpriority="high" onerror="window.handleImageError(this)">
      <div class="container page-banner-content">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="./index.html" data-i18n="nav.home">الرئيسية</a>
          <span>/</span>
          <span data-i18n="nav.myBookings">حجوزاتي</span>
        </nav>
        <h1 class="page-banner-title" data-i18n="myBookingsPage.title">حجوزاتي ومواعيدي الطبية</h1>
        <p class="page-banner-desc" data-i18n="myBookingsPage.subtitle">يمكنك مراجعة مواعيدك المحفوظة على هذا المتصفح، أو إلغاؤها، أو إعادة جدولتها بسهولة.</p>
      </div>
    </section>

    <section class="section section-light">
      <div class="container">
        <!-- قائمة الحجوزات تُحقن بواسطة JavaScript -->
        <div class="bookings-list-wrap" id="my-bookings-list"></div>

        <!-- حالة الحجوزات الفارغة -->
        <div class="empty-state" id="my-bookings-empty" style="display:none;">
          <div class="empty-state-icon">
            <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </div>
          <h2 class="empty-state-title" data-i18n="myBookingsPage.emptyTitle">لا توجد حجوزات مسجلة حالياً</h2>
          <p class="empty-state-desc" data-i18n="myBookingsPage.emptyDesc">لم تقم بحجز أي مواعيد بعد على هذا المتصفح. يمكنك تصفح الأطباء واختيار موعد جديد الآن.</p>
          <a href="./booking.html" class="btn btn-primary" data-i18n="myBookingsPage.bookNowCTA">احجز موعداً جديداً</a>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

</body>
</html>
